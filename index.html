<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <h3 class="text-center mt-5 mb-4">Formulário de Cadastro</h3>

            
                <form class="p-4 border rounded bg-white">

                    
                    <div class="mb-3">
                        <input
                            type="text"
                            class="form-control"
                            placeholder="Nome completo">
                    </div>

                   
                    <div class="mb-3">
                        <input
                            type="email"
                            class="form-control"
                            placeholder="E-mail">
                    </div>

                    
                    <div class="mb-3">
                        <input
                            type="tel"
                            class="form-control"
                            placeholder="Telefone">
                    </div>

                   
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">
                            Cadastrar
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

   
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
